/* PDF file name pattern: pdfs/AJP1.pdf ... pdfs/AJP10.pdf, pdfs/AML1.pdf ..., pdfs/WEB1.pdf ... */

const list = document.getElementById("list");
const buttons = document.querySelectorAll(".tabs button");

buttons.forEach(btn => btn.addEventListener("click", () => {
  const s = btn.dataset.s;
  buttons.forEach(b => b.classList.toggle("active", b === btn));
  list.innerHTML = "";
  programs[s].forEach((title, i) => {
    const n = i + 1;
    const extra = files[s + n];
    const links = extra
      ? extra.map(f => `<a class="${f.zip ? "zip" : ""}" href="${f.href}" download="${f.name}">${f.label}</a>`).join("")
      : `<a href="pdfs/${s}${n}.pdf" download="${s}_Program${n}.pdf">Download</a>`;
    const row = document.createElement("div");
    row.className = "item";
    row.innerHTML = `<span>${n}. ${s} - ${title}</span><div class="btns">${links}</div>`;
    list.appendChild(row);
  });
}));
</script>
